apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty('namespace')) namespace 'io.sentry.haxe'
    compileSdkVersion Integer.parseInt(project.ANDROID_BUILD_SDK_VERSION)
    defaultConfig { minSdkVersion 21 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            manifest.srcFile 'android/AndroidManifest.xml'
            java.srcDirs = ['android/src', 'java/src']
        }
    }
    defaultConfig { consumerProguardFiles 'android/consumer-rules.pro' }
}

repositories { mavenCentral() }
dependencies {
    implementation project(':deps:extension-api')
    api 'io.sentry:sentry-android:8.24.0'
}
